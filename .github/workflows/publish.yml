# Publishes TrainStream's source distribution to PyPI with trusted publishing
# (OpenID Connect, no API token). Runs when a GitHub release is published.
#
# PyPI side (pypi.org -> Publishing -> add a GitHub publisher):
#   Owner: johnanishg   Repository: TrainStream   Workflow: publish.yml   Environment: pypi
#
# Only the sdist is published: TrainStream compiles against the user's own
# CUDA-enabled PyTorch, which GitHub's GPU-less runners do not have.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trainstream
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
