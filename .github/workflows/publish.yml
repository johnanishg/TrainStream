# Publishes TrainStream's sdist and wheel to PyPI with trusted publishing
# (OpenID Connect, no API token). Runs when a GitHub release is published.
#
# PyPI side (pypi.org -> Publishing -> add a GitHub publisher):
#   Owner: johnanishg   Repository: TrainStream   Workflow: publish.yml   Environment: pypi
#
# The wheel is pure Python (py3-none-any): it carries the C++/CUDA sources, and
# the first `import trainstream` compiles them against the user's own PyTorch.
# So `pip install trainstream` needs no compiler, PyTorch or flags at install time.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          ls dist/*-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trainstream
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
